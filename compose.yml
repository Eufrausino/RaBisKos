services:
  nameserver:
    init: true 
    build: ./middleware

  servidor:
    init: true
    build: ./servidor
    ports:
      - "5000:5000"
    volumes:
      - ./servidor:/app
      - ./data:/app/data
    command: watchmedo auto-restart --recursive --pattern="*.py" --directory="." python3 main_servidor.py
    environment:
      - DB_PATH=/app/data/sistema.db
      - PYTHONPATH=/app
      - NS_HOST=nameserver
      - NS_PORT=9090
      - SERVIDOR_HOST=servidor
    depends_on:
      - db-init
      - nameserver

  db-init:
    image: busybox
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "touch /app/data/sistema.db && chmod 666 /app/data/sistema.db"]

  cliente:
    init: true
    build: ./cliente
    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=/tmp/wayland-runtime
      - QT_QPA_PLATFORM=wayland;xcb
      - XAUTHORITY=/tmp/.Xauthority
      - NS_HOST=nameserver
      - NS_PORT=9090
      # - SERVER_HOST=servidor
      # - SERVER_PORT=5000
    volumes:
      - ./cliente:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:/tmp/wayland-runtime
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority
    command: watchmedo auto-restart --recursive --pattern="*.py" --directory="." python3 main_cliente.py
    depends_on:
      - servidor
